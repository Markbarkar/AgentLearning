server {
    listen 80;
    server_name www.zktmai.com;
    
    # HTTP 重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name www.zktmai.com;
    
    # SSL 证书配置 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/www.zktmai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zktmai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/contract-comparison/;
    index index.html;

    # 文件存储访问配置
    location /wxMiniProgram/ {
        alias /data/contract-comparison/wxMiniProgram/;
        autoindex off;
        expires 1d;
        add_header Cache-Control "public, no-transform";
        
        # 允许跨域
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
        
        # 处理OPTIONS请求
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # OCR 服务代理（优先级高于 /api/，必须放在 /api/ 之前）
    location /api/process_image_direct {
        proxy_pass http://127.0.0.1:8000/api/process_image_direct;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # OCR上传需要较大的文件限制和较长的超时时间
        # PDF文件可能较大，图片转换和识别需要时间
        client_max_body_size 100m;
        client_body_timeout 600s;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        
        # 禁用缓冲以支持长时间请求
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /api/process_image {
        proxy_pass http://127.0.0.1:8000/api/process_image;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # OCR上传需要较大的文件限制和较长的超时时间
        client_max_body_size 100m;
        client_body_timeout 600s;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        
        # 禁用缓冲以支持长时间请求
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /model/ {
        proxy_pass http://192.168.2.106:8000;
        client_max_body_size 100m;

        # 通用跨域设置（必须放外面）
        # add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
        add_header Access-Control-Max-Age 3600 always;

        # 预检请求单独处理
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 反向代理设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 反向代理（Java后端）
    location /api/ {
        proxy_pass http://127.0.0.1:5678/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 请求体大小，限制上传文件大小
        client_max_body_size 100m;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    location /agent/ {
        proxy_pass http://127.0.0.1:8003;
        client_max_body_size 100m;

        # 通用跨域设置
          add_header Access-Control-Allow-Origin $http_origin always;
          add_header Access-Control-Allow-Credentials true always;
          add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE' always;
          add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
          add_header Access-Control-Max-Age 3600 always;

        # 预检请求单独处理(把cors交给nginx，后端就不要做相关配置了，会冲突)
        if ($request_method = 'OPTIONS') {
		add_header Access-Control-Allow-Origin $http_origin always;
          	add_header Access-Control-Allow-Credentials true always;
          	add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE' always;
          	add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
          	add_header Access-Control-Max-Age 3600 always;
                return 204;
          }

        # 反向代理设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 超时设置
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 处理单页应用路由
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        # API响应不缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        # HTML文件不缓存
        location ~ \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # JS和CSS文件使用强缓存，因为文件名中包含了内容哈希
        location ~* \.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }

        # 图片和字体文件使用强缓存
        location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 静态资源缓存配置
    location /js/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    location /css/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    location /img/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # 开启gzip压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/jpeg image/png;
    gzip_vary on;
}
