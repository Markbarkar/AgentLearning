server {
    listen 8001 ssl;
    server_name www.zktmai.com;

    # SSL 证书配置 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/www.zktmai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zktmai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 请求体数据到达超时时间
    client_body_timeout 600s;
    # 请求头发送完成超时时间
    client_header_timeout 600s;
    # 客户端发送响应数据超时时间
    send_timeout 600s;
    # nginx和server建立连接超时时间
    proxy_connect_timeout 600s;
    # nginx向后端发送请求数据的超时时间
    proxy_send_timeout 600s;
    # nginx等待后端返回的响应超时时间
    proxy_read_timeout 600s;

    proxy_buffering off;
    proxy_request_buffering off;

    keepalive_timeout 600s;

    # WebSocket 专用配置
    location /model/ws/ {
        proxy_pass http://192.168.2.106:8000;

        # WebSocket 升级配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 基本代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 特定超时设置
        proxy_read_timeout 3600s;
    	proxy_send_timeout 3600s;

    	# 禁用缓冲以确保实时性
    	proxy_buffering off;
    	proxy_request_buffering off;

    	# CORS 设置（WebSocket 握手需要）
    	# add_header Access-Control-Allow-Origin $cors_origin always;
    	# add_header Access-Control-Allow-Credentials true always;
    }

    location /model/ {
        proxy_pass http://192.168.2.106:8000;
	    client_max_body_size 100m;

        # 通用跨域设置（必须放外面）
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
        add_header Access-Control-Max-Age 3600 always;

        # 预检请求单独处理
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Credentials true always;
          	add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE' always;
          	add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
          	add_header Access-Control-Max-Age 3600 always;
            return 204;
        }

        # 反向代理设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
    	proxy_pass http://192.168.2.106:8000;
    	client_max_body_size 100m;

    	# 通用跨域设置
    	add_header Access-Control-Allow-Origin $http_origin always;
    	add_header Access-Control-Allow-Credentials true always;
    	add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE' always;
    	add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
    	add_header Access-Control-Max-Age 3600 always;

    	# 预检请求单独处理
        if ($request_method = 'OPTIONS') {
		add_header Access-Control-Allow-Origin $http_origin always;
          	add_header Access-Control-Allow-Credentials true always;
          	add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE' always;
          	add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
          	add_header Access-Control-Max-Age 3600 always;
                return 204;
          }

    	# 反向代理设置
    	proxy_set_header Host $host;
    	proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    	# 超时设置
    	proxy_connect_timeout 600s;
    	proxy_send_timeout 600s;
    	proxy_read_timeout 600s;
	
    	proxy_buffering off;
    	proxy_request_buffering off;
	}

    location /agent/ {
        proxy_pass http://192.168.2.106:8003;
        client_max_body_size 100m;

        # 通用跨域设置
          add_header Access-Control-Allow-Origin $http_origin always;
          add_header Access-Control-Allow-Credentials true always;
          add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE' always;
          add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
          add_header Access-Control-Max-Age 3600 always;

        # 预检请求单独处理(把cors交给nginx，后端就不要做相关配置了，会冲突)
        if ($request_method = 'OPTIONS') {
		add_header Access-Control-Allow-Origin $http_origin always;
          	add_header Access-Control-Allow-Credentials true always;
          	add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE' always;
          	add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
          	add_header Access-Control-Max-Age 3600 always;
                return 204;
          }

        # 反向代理设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 超时设置
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
